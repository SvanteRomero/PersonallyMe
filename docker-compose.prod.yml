version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: taskmanager_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmanager_user} -d ${POSTGRES_DB:-taskmanager}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django Backend (Gunicorn) - directly accessible via BACKEND_DOMAIN
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: taskmanager_backend
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=${BACKEND_DOMAIN:-localhost},localhost,127.0.0.1
      - POSTGRES_DB=${POSTGRES_DB:-taskmanager}
      - POSTGRES_USER=${POSTGRES_USER:-taskmanager_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taskmanager_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CORS_ALLOWED_ORIGINS=https://${FRONTEND_DOMAIN:-localhost:3000},http://${FRONTEND_DOMAIN:-localhost:3000}
      - CSRF_TRUSTED_ORIGINS=https://${FRONTEND_DOMAIN:-localhost:3000},http://${FRONTEND_DOMAIN:-localhost:3000}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 config.wsgi:application"
    restart: unless-stopped

  # Nginx (React SPA only - no API proxy)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: taskmanager_frontend
    volumes:
      - static_volume:/app/staticfiles:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
